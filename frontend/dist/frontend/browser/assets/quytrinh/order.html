<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUY TRÌNH LÊN ĐƠN & KIỂM SOÁT</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 300px; 
            margin: auto;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }

        .step-card {
            border-left: 4px solid #e2e8f0;
            transition: all 0.2s ease;
        }
        .step-card:hover {
            border-left-color: #3b82f6;
            background-color: #f8fafc;
        }
        
        .formula-box {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            border: 1px solid #10b981;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">📦 ORDER TEAM</h1>
                <p class="text-blue-200 text-sm mt-1">Hệ thống Quy trình Lên đơn & Kiểm soát đơn hàng</p>
            </div>
            <div class="hidden sm:block text-right text-sm bg-blue-800 px-4 py-2 rounded-lg border border-blue-600">
                <span class="block font-semibold">ERP System</span>
                <a href="https://tg.rausachtrangia.com" target="_blank" class="text-blue-300 hover:text-white underline transition">tg.rausachtrangia.com</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column -->
        <div class="lg:col-span-4 flex flex-col gap-6">
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-5 border-b border-slate-100 bg-slate-50">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <span>🗺️</span> Bản Đồ Quy Trình
                    </h2>
                </div>
                <div class="p-4 flex flex-col gap-3" id="process-nav"></div>
            </section>

            <section class="bg-blue-50 rounded-xl shadow-sm border border-blue-100 overflow-hidden">
                <div class="p-5 border-b border-blue-100 bg-blue-100/50">
                    <h2 class="text-lg font-bold text-blue-800 flex items-center gap-2">
                        <span>💡</span> Công Cụ Tra Cứu đơn vị tính
                    </h2>
                </div>
                <div class="p-5">
                    <label for="unit-selector" class="block text-sm font-medium text-slate-700 mb-2">Chọn đơn vị tính mặt hàng:</label>
                    <select id="unit-selector" class="w-full border-slate-300 rounded-md shadow-sm p-2 focus:border-blue-500 focus:ring-blue-500 mb-4 bg-white">
                        <option value="">-- Chọn đơn vị --</option>
                        <option value="kg">Kg / Lít (Hàng cân)</option>
                        <option value="goi">Gói / Hộp / Vỉ / Trái / Bó (Đóng gói/Rời)</option>
                    </select>
                    <div id="rule-result" class="hidden rounded-lg p-4 text-sm"></div>
                </div>
            </section>
        </div>

        <!-- Right Column -->
        <div class="lg:col-span-8 flex flex-col gap-6">
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full min-h-[600px]">
                <div class="p-6 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-slate-800" id="detail-title">Vui lòng chọn một giai đoạn</h2>
                    <span id="detail-icon" class="text-3xl opacity-80"></span>
                </div>
                <div class="p-6 overflow-y-auto custom-scrollbar flex-grow" id="detail-content"></div>
            </section>

            <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden grid grid-cols-1 md:grid-cols-2">
                <div class="p-6 border-r border-slate-100">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 mb-2">
                        <span>✅</span> Bảng Kiểm Tra Cuối Ngày
                    </h2>
                    <div id="checklist-container" class="flex flex-col gap-2"></div>
                </div>
                <div class="p-6 flex flex-col justify-center items-center bg-slate-50/50">
                    <h3 class="text-sm font-semibold text-slate-600 mb-2 text-center">Tiến độ kiểm soát</h3>
                    <div class="chart-container">
                        <canvas id="progressChart"></canvas>
                    </div>
                    <p id="chart-status-text" class="text-center font-bold text-blue-600 mt-2">0/6 Hoàn thành</p>
                </div>
            </section>
        </div>
    </main>

    <footer class="bg-slate-800 text-slate-400 py-6 text-center text-sm">
        <p>&copy; Hệ thống Quản trị Quy trình Nội bộ - Trangia Order Team</p>
    </footer>

    <script>
        const sopData = {
            phase1: {
                id: 'phase1',
                title: 'Giai Đoạn 1: Tiếp Nhận & Xử Lý',
                icon: '📥',
                color: 'blue',
                summary: 'Kiểm tra tin nhắn Zalo và nhập liệu Template.',
                content: `
                    <div class="space-y-6">
                        <div class="step-card p-4 bg-white rounded shadow-sm border">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded">1</span>
                                <h3 class="font-bold text-slate-800">Tiếp nhận & Xác nhận</h3>
                            </div>
                            <ul class="list-disc pl-5 text-sm space-y-2 text-slate-700">
                                <li>Kiểm tra tất cả tin nhắn Zalo: Đơn sớm, hàng đổi trả, bù hàng.</li>
                                <li>Check hình ảnh/file: Nếu mờ hoặc thiếu thông tin phải hỏi khách ngay.</li>
                                <li><strong class="text-blue-700">Xác nhận:</strong> Phản hồi "Đã nhận đơn" trên nhóm Zalo.</li>
                            </ul>
                        </div>

                        <div class="step-card p-4 bg-white rounded shadow-sm border">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded">2</span>
                                <h3 class="font-bold text-slate-800">Nhập liệu file Template (Excel)</h3>
                            </div>
                            <div class="p-3 bg-slate-50 border rounded text-xs mb-4">
                                <p class="mb-1"><strong>Kg/Lít:</strong> Chấp nhận lẻ (Dùng dấu chấm .)</p>
                                <p><strong>Khác:</strong> Bắt buộc số nguyên (Làm tròn).</p>
                            </div>
                            <div class="bg-yellow-50 p-3 rounded border border-yellow-200 text-xs text-yellow-800 italic">
                                <strong>Lỗi #N/A:</strong> Báo Admin bổ sung mã ngay, không được tự ý bỏ sót.
                            </div>
                        </div>
                    </div>
                `
            },
            phase2: {
                id: 'phase2',
                title: 'Giai Đoạn 2: Lên Đơn ERP',
                icon: '🖥️',
                color: 'indigo',
                summary: 'Tải file, tạo đơn thủ công và xử lý bổ sung.',
                content: `
                    <div class="space-y-6">
                        <div class="step-card p-4 bg-white rounded shadow-sm border">
                            <h3 class="font-bold text-slate-800 mb-2">A. Lên đơn hàng loạt (Import)</h3>
                            <ol class="list-decimal pl-5 text-sm space-y-1 text-slate-700">
                                <li>Vào "Lên Đơn" -> Tải lên file excel.</li>
                                <li>Chọn Ngày giao hàng chính xác.</li>
                                <li>Chọn Khách hàng tương ứng từng đơn.</li>
                                <li>Tích "Chọn tất cả" -> Bấm <strong class="text-emerald-600">Import đơn hàng</strong>.</li>
                            </ol>
                        </div>

                        <div class="step-card p-4 bg-white rounded shadow-sm border">
                            <h3 class="font-bold text-slate-800 mb-2">B. Tạo đơn hàng thủ công</h3>
                            <p class="text-sm text-slate-700">Vào "Lên Đơn" -> Bấm "Tạo Mới" -> Nhập sản phẩm -> Bấm vào <strong>icon lưu (đĩa mềm)</strong>.</p>
                        </div>

                        <div class="step-card p-4 bg-white rounded shadow-sm border">
                            <h3 class="font-bold text-slate-800 mb-2">C. Chỉnh sửa đơn / Bổ sung</h3>
                            <p class="text-sm text-slate-700">Load dữ liệu kính lúp -> Tìm đơn khách -> Bấm <strong>cây bút (Sửa)</strong> -> Bắt buộc bấm <strong>Lưu</strong>.</p>
                        </div>
                    </div>
                `
            },
            phase3: {
                id: 'phase3',
                title: 'Giai Đoạn 3: Kiểm Soát & Đối Soát',
                icon: '🔎',
                color: 'emerald',
                summary: 'Dùng công thức F5 để rà soát rủi ro.',
                content: `
                    <div class="space-y-6">
                        <div class="step-card p-4 bg-white rounded shadow-sm border">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="bg-emerald-600 text-white text-xs font-bold px-2 py-1 rounded">1</span>
                                <h3 class="font-bold text-slate-800">Nguyên tắc đối soát F5</h3>
                            </div>
                            <div class="formula-box p-4 rounded-lg text-center mb-2">
                                <div class="text-sm font-mono font-bold text-emerald-900">
                                    Tổng đơn (TRƯỚC) + Số file Import = Tổng đơn (SAU)
                                </div>
                            </div>
                            <p class="text-xs text-slate-500 italic text-center">* Luôn F5 lại hệ thống để cập nhật số liệu mới nhất.</p>
                        </div>

                        <div class="step-card p-4 bg-white rounded shadow-sm border">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="bg-emerald-600 text-white text-xs font-bold px-2 py-1 rounded">2</span>
                                <h3 class="font-bold text-slate-800">Đối chiếu Thư mục & Zalo</h3>
                            </div>
                            <ul class="list-disc pl-5 text-sm space-y-2 text-slate-700">
                                <li>Từng file trong máy phải khớp với 1 mã đơn ERP.</li>
                                <li>Kiểm tra ngược từ Zalo: Khách nào nhắn tin mà ERP chưa có đơn?</li>
                            </ul>
                        </div>
                    </div>
                `
            },
            kpi: {
                id: 'kpi',
                title: 'Phạt Lỗi (KPI Đội Ngũ)',
                icon: '⚠️',
                color: 'red',
                summary: 'Mức phạt trừ % tính trên món lỗi.',
                content: `
                    <div class="space-y-6">
                        <div class="overflow-hidden border border-slate-200 rounded-lg">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-red-600 text-white font-bold">
                                    <tr>
                                        <th class="px-4 py-2">Nhóm Lỗi</th>
                                        <th class="px-4 py-2 text-center">Phạt</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200 bg-white">
                                    <tr class="hover:bg-red-50">
                                        <td class="px-4 py-3">
                                            <p class="font-bold text-slate-900">1. Sai định lượng, nhầm món, nhầm mã sản phẩm...</p>
                                            <p class="text-[11px] italic text-slate-500 mt-1"><strong class="text-red-500">VD:</strong> Khách đặt 1.5kg lên nhầm 15kg; hoặc đặt Cải bó xôi lên nhầm Cải ngọt.</p>
                                        </td>
                                        <td class="px-4 py-3 text-center font-bold text-red-600">10%</td>
                                    </tr>
                                    <tr class="hover:bg-red-50">
                                        <td class="px-4 py-3">
                                            <p class="font-bold text-slate-900">2. Không lên đơn, bỏ sót đơn hàng của khách...</p>
                                            <p class="text-[11px] italic text-slate-500 mt-1"><strong class="text-red-500">VD:</strong> Khách nhắn Zalo lúc tối nhưng nhân viên quên không nhập liệu dẫn đến thiếu hàng.</p>
                                        </td>
                                        <td class="px-4 py-3 text-center font-bold text-red-600">20%</td>
                                    </tr>
                                    <tr class="hover:bg-red-50">
                                        <td class="px-4 py-3">
                                            <p class="font-bold text-slate-900">3. Nhầm khách hàng, sai ngày giao hàng...</p>
                                            <p class="text-[11px] italic text-slate-500 mt-1"><strong class="text-red-500">VD:</strong> Đơn Khách A nhưng Import nhầm cho Khách B; đơn ngày 05 nhầm sang ngày 06.</p>
                                        </td>
                                        <td class="px-4 py-3 text-center font-bold text-red-600">25%</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `
            }
        };

        const checklistItems = [
            "Hàng đóng gói (Gói/Vỉ/Hộp) là số nguyên?",
            "Dấu chấm (.) dùng cho thập phân?",
            "Ngày giao hàng trên ERP chính xác?",
            "Đã bấm icon LƯU sau khi sửa đơn?",
            "Đã F5 đối soát tổng lượng đơn?",
            "Mã hàng không bị lỗi #N/A?"
        ];

        let currentPhase = 'phase1';
        let checklistState = new Array(checklistItems.length).fill(false);
        let progressChartInstance = null;

        function renderProcessNav() {
            const navContainer = document.getElementById('process-nav');
            navContainer.innerHTML = '';
            Object.values(sopData).forEach(phase => {
                const isActive = phase.id === currentPhase;
                const activeClasses = isActive ? `bg-${phase.color}-50 border-${phase.color}-600 shadow-sm` : `bg-white border-transparent hover:bg-slate-50 hover:border-slate-300`;
                navContainer.insertAdjacentHTML('beforeend', `
                    <div class="cursor-pointer rounded-lg p-4 transition-all duration-200 border-l-4 group ${activeClasses}" onclick="changePhase('${phase.id}')">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">${phase.icon}</span>
                            <div class="flex-grow">
                                <h3 class="font-bold ${isActive ? `text-${phase.color}-800` : 'text-slate-700 group-hover:text-blue-600'}">${phase.title}</h3>
                                <p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mt-0.5">${phase.summary}</p>
                            </div>
                        </div>
                    </div>
                `);
            });
        }

        function renderDetailContent() {
            const data = sopData[currentPhase];
            document.getElementById('detail-title').textContent = data.title;
            document.getElementById('detail-icon').textContent = data.icon;
            document.getElementById('detail-content').innerHTML = data.content;
        }

        function changePhase(phaseId) {
            currentPhase = phaseId;
            renderProcessNav();
            renderDetailContent();
        }

        document.getElementById('unit-selector').addEventListener('change', function(e) {
            const resultDiv = document.getElementById('rule-result');
            const val = e.target.value;
            resultDiv.classList.remove('hidden', 'bg-green-100', 'bg-red-100', 'text-green-800', 'text-red-800');
            if (!val) { resultDiv.classList.add('hidden'); return; }
            if (val === 'kg') {
                resultDiv.classList.add('bg-green-100', 'text-green-800');
                resultDiv.innerHTML = '<strong>ĐỊNH DẠNG:</strong> Được lẻ thập phân (Dùng dấu chấm .)';
            } else {
                resultDiv.classList.add('bg-red-100', 'text-red-800');
                resultDiv.innerHTML = '<strong>ĐỊNH DẠNG:</strong> BẮT BUỘC số nguyên (Không để lẻ)';
            }
        });

        function renderChecklist() {
            const container = document.getElementById('checklist-container');
            container.innerHTML = '';
            checklistItems.forEach((item, index) => {
                const isChecked = checklistState[index];
                container.insertAdjacentHTML('beforeend', `
                    <label class="flex items-center gap-3 p-2 rounded hover:bg-slate-50 cursor-pointer border border-transparent hover:border-slate-200">
                        <input type="checkbox" class="w-5 h-5 text-emerald-600 rounded border-slate-300" ${isChecked ? 'checked' : ''} onchange="toggleChecklist(${index})">
                        <span class="text-sm ${isChecked ? 'text-slate-400 line-through' : 'text-slate-700 font-medium'}">${item}</span>
                    </label>
                `);
            });
        }

        function toggleChecklist(index) {
            checklistState[index] = !checklistState[index];
            renderChecklist();
            updateChart();
        }

        function initChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            progressChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Hoàn thành', 'Chưa xong'],
                    datasets: [{
                        data: [0, checklistItems.length],
                        backgroundColor: ['#10b981', '#e2e8f0'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { display: false } } }
            });
        }

        function updateChart() {
            const completed = checklistState.filter(Boolean).length;
            progressChartInstance.data.datasets[0].data = [completed, checklistItems.length - completed];
            progressChartInstance.update();
            const statusText = document.getElementById('chart-status-text');
            statusText.textContent = `${completed}/${checklistItems.length} Hoàn thành`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderProcessNav();
            renderDetailContent();
            renderChecklist();
            initChart();
        });
    </script>
</body>
</html>
