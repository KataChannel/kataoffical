
<div class="relative w-screen h-screen overflow-hidden flex flex-col bg-[#0A7A3D]">
  <div class="absolute inset-0 bg-black opacity-10"></div>
  
  <div class="relative z-10 flex grow items-center justify-center p-4">
    <div class="w-full max-w-lg">
      <div class="relative w-full grid lg:grid-cols-1 gap-8 lg:p-16 p-8 overflow-hidden bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl">
        
        <div class="relative flex flex-col space-y-6 items-center w-full">
          <img [src]="Config.Logo.url" [alt]="Config.Logo.alt" class="max-h-32 w-auto drop-shadow-md mb-4">
          
          <mat-form-field subscriptSizing="dynamic" appearance="outline" class="w-full">
            <mat-label>Số điện thoại</mat-label>
            <input type="text" matInput [(ngModel)]="User.SDT" [ngModelOptions]="{standalone: true}" [placeholder]="'Số điện thoại'"/>
            <mat-icon matPrefix class="!mr-2 text-green-600">call</mat-icon>
          </mat-form-field>

          <mat-form-field subscriptSizing="dynamic" appearance="outline" class="w-full">
            <mat-label>Mật khẩu</mat-label>
            <input type="password" matInput (keyup.enter)="Dangnhap()" [(ngModel)]="User.password" [ngModelOptions]="{standalone: true}" [placeholder]="'Mật khẩu'"/>
            <mat-icon matPrefix class="!mr-2 text-green-600">lock</mat-icon>
          </mat-form-field>

          <button (click)="Dangnhap()" class="w-full lg:w-64 cursor-pointer flex items-center justify-center p-4 rounded-xl bg-[#0A7A3D] text-white font-bold hover:bg-[#086331] transition-all duration-300 shadow-lg shadow-green-900/20 active:scale-95">
              <span>Đăng nhập tài khoản</span>   
          </button>

          <div class="text-center font-bold"> Hoặc Đăng Nhập Bằng</div>

          <div class="cursor-pointer lg:w-64 w-full">
            <span (click)="loginGoogle()" class="border flex space-x-2 items-center justify-center p-2 rounded-lg bg-slate-100 hover:bg-white transition-colors duration-200">
              <svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
                <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
              </svg>    
              <span>Gmail</span>   
            </span>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
