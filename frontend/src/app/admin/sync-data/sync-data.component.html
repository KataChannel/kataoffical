<h2 class="mb-4">Cập nhật Dữ Liệu</h2>

<div class="row">
    <div class="col-sm-12">
        <mat-card>
            <mat-card-header>
                <mat-card-title>Đồng bộ dữ liệu từ Cơ sở dữ liệu Thực</mat-card-title>
                <mat-card-subtitle>Lấy DATA MỚI từ máy chủ (116.118.49.243) về máy cục bộ — chỉ THÊM đơn hàng / khách / NCC / đơn mua mới, KHÔNG ghi đè (giữ nguyên dữ liệu go-live).</mat-card-subtitle>
            </mat-card-header>

            <mat-card-content class="pt-4">
                <div class="row">
                    <div class="col-sm-3 col-6 text-center mb-3">
                        <button mat-raised-button color="primary" class="w-100 p-4" (click)="syncPartial('ĐƠN HÀNG')">
                            <mat-icon style="display: block; margin: 0 auto; margin-bottom: 8px;">receipt</mat-icon>
                            ĐƠN HÀNG
                        </button>
                    </div>
                    <div class="col-sm-3 col-6 text-center mb-3">
                        <button mat-raised-button color="accent" class="w-100 p-4" (click)="syncPartial('KHÁCH HÀNG')">
                            <mat-icon style="display: block; margin: 0 auto; margin-bottom: 8px;">person</mat-icon>
                            KHÁCH HÀNG
                        </button>
                    </div>
                    <div class="col-sm-3 col-6 text-center mb-3">
                        <button mat-raised-button color="warn" class="w-100 p-4" (click)="syncPartial('SẢN PHẨM')">
                            <mat-icon style="display: block; margin: 0 auto; margin-bottom: 8px;">inventory_2</mat-icon>
                            SẢN PHẨM
                        </button>
                    </div>
                    <div class="col-sm-3 col-6 text-center mb-3">
                        <button mat-raised-button style="background: #4caf50; color: white" class="w-100 p-4" (click)="startSyncFull()" [disabled]="isSyncing">
                            <mat-icon style="display: block; margin: 0 auto; margin-bottom: 8px;">cloud_sync</mat-icon>
                            ĐỒNG BỘ DATA MỚI
                        </button>
                    </div>
                </div>

                <div class="mt-4 p-4 border rounded" *ngIf="isSyncing || progress > 0 || hasError">
                    <h4 [class.text-danger]="hasError" [class.text-success]="progress === 100 && !hasError">
                        <mat-icon *ngIf="isSyncing" class="spin-icon">sync</mat-icon>
                        <mat-icon *ngIf="progress === 100 && !hasError">check_circle</mat-icon>
                        <mat-icon *ngIf="hasError">error</mat-icon>
                        {{ message }}
                    </h4>
                    
                    <mat-progress-bar 
                        class="mt-3"
                        [mode]="isSyncing ? 'indeterminate' : 'determinate'"
                        [value]="progress"
                        [color]="hasError ? 'warn' : 'primary'">
                    </mat-progress-bar>
                    
                    <div class="mt-2 d-flex justify-content-between">
                        <span>{{ progress }}%</span>
                        <span *ngIf="isSyncing" class="text-muted">Đang xử lý, vui lòng không tắt trang...</span>
                    </div>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
