services:
  postgres:
    image: postgres:15
    container_name: ${PG_CONTAINER_NAME:-rausach-postgres}
    restart: always
    environment:
      POSTGRES_USER: AWois79wFA1bxMK
      POSTGRES_PASSWORD: 7bhNHJcSEbWln9v
      POSTGRES_DB: rausachfinal
    ports:
      - "${PG_PORT:-55432}:5432"
  pgadmin:
    image: dpage/pgadmin4
    container_name: ${PGADMIN_CONTAINER_NAME:-rausach-pgadmin}
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rausachtrangia.com
      PGADMIN_DEFAULT_PASSWORD: 7bhNHJcSEbWln9v
    ports:
      - "${PGADMIN_PORT:-55050}:80"
    depends_on:
      - postgres
  redis:
    image: redis:latest
    container_name: ${REDIS_CONTAINER_NAME:-rausach-redis}
    restart: always
    ports:
      - "${REDIS_PORT_EXT:-56379}:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
  berausach:
    build: ./api
    container_name: ${BE_CONTAINER_NAME:-rausach-backend}
    restart: always
    ports:
      - "${BE_PORT:-53333}:3331"
    environment:
      #- DATABASE_URL=postgresql://AWois79wFA1bxMK:7bhNHJcSEbWln9v@116.118.49.243:5432/testdata?schema=public
      - DATABASE_URL=postgresql://AWois79wFA1bxMK:7bhNHJcSEbWln9v@116.118.49.243:55432/testdata?schema=public&connection_limit=25&pool_timeout=60&connect_timeout=20
      - GOOGLE_CLIENT_ID=897974685698-efprsqffgop935h5d5l2lidle1go9i17.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
      - FACEBOOK_CLIENT_ID=your-facebook-client-id
      - FACEBOOK_CLIENT_SECRET=your-facebook-client-secret
      - ZALO_APP_ID=your-zalo-app-id
      - ZALO_APP_SECRET=your-zalo-app-secret
      - BASE_URL=https://tg.rausachtrangia.com
      - SERVER_URL=https://apisandbox.rausachtrangia.com
      - PORT=3331
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=storage.rausachtrangia.com
      - MINIO_PORT=59000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=RC4hWSS4V6QIcfl
      - MINIO_SECRET_KEY=LEOZHZwjaasTTKk
      - MINIO_ROOT_USER=RC4hWSS4V6QIcfl
      - MINIO_ROOT_PASSWORD=LEOZHZwjaasTTKk
      - MINIO_BUCKET_NAME=uploads
      - MINIO_BUCKET=uploads
      - MINIO_REGION=us-east-1
      - MINIO_PUBLIC_URL=http://storage.rausachtrangia.com:59000
      - GOOGLE_API_KEY=AIzaSyAcLy3dOt27BgxkDSAY7fRm0jbwlzPo-80
    depends_on:
      - postgres
      - redis
  ferausach:
    build: ./frontend
    container_name: ${FE_CONTAINER_NAME:-rausach-frontend}
    restart: always
    ports:
      - "${FE_PORT:-54303}:4301"
    environment:
      - NODE_ENV=production

  minio_rausach:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    container_name: ${MINIO_CONTAINER_NAME:-rausach-minio}
    command: server /data --console-address ":9090"
    ports:
      - "${MINIO_PORT_EXT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59090}:9090"
    environment:
      MINIO_ROOT_USER: RC4hWSS4V6QIcfl
      MINIO_ROOT_PASSWORD: LEOZHZwjaasTTKk
    volumes:
      - minio_rausach:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  uploads_data:
    driver: local
  minio_rausach:
